; MwalimuPlus — PHP overrides for hosts that honour .user.ini (PHP-FPM / CGI,
; e.g. cPanel). Apache mod_php reads php_value in .htaccess instead; the
; built-in dev server (php -S) ignores both. Keeps scheme-resource PDF uploads
; (10 MB app cap) from tripping the default 2M/8M limits.
upload_max_filesize = 12M
post_max_size = 13M
